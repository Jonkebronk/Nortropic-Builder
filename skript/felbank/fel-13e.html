<!doctype html>
<!-- Felbanken, kontroll 13e: en animation som pågår i all oändlighet utan pausknapp. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 13e</title>
<style>.puls { animation: puls 1.3s infinite alternate; } @keyframes puls { from { background: #fff; } to { background: #fc0; } }</style>
</head>
<body>
<main><h1>Puls</h1><p class="puls">Erbjudande!</p></main>
</body>
</html>
