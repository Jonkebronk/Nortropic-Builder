<!doctype html>
<!-- Felbanken, kontroll 13b: en dold rullist på en yta som rullar, mask över text, justerad text och forced-color-adjust: none. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 13b</title>
<style>.r { height: 3rem; overflow: auto; scrollbar-width: none; } .m { mask-image: linear-gradient(#000, transparent); } .j { text-align: justify; } .f { forced-color-adjust: none; }</style>
</head>
<body>
<main><h1>Ytor</h1><div class="r"><p>Rad 1</p><p>Rad 2</p><p>Rad 3</p><p>Rad 4</p></div><p class="m">Text under en mask.</p><p class="j">Justerad text som sträcks ut över hela raden och ger ojämna mellanrum mellan orden i stycket.</p><p class="f">Egna färger.</p></main>
</body>
</html>
