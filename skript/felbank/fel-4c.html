<!doctype html>
<!-- Felbanken, kontroll 4c: två sorters handlingar fyllda med accent i samma fönster, och en bricka med accent som inte är en handling. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 4c</title>
<style>:root { --k-accent: #b4471c; } .k, .bricka { display: inline-block; padding: 0.5rem 1rem; background: var(--k-accent); color: #fff; }</style>
</head>
<body>
<main><h1>Boka</h1><p><a class="k" href="https://boka.foretaget.invalid/">Boka tid</a> <a class="k" href="https://kartor.invalid/vag">Vägbeskrivning</a></p><p class="bricka">Nyhet</p></main>
</body>
</html>
