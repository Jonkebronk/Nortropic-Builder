<!doctype html>
<!-- Felbanken, kontroll 13d: en animation som flyttar ett element utan villkoret prefers-reduced-motion. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 13d</title>
<style>.glid { animation: glid 2s infinite alternate; } @keyframes glid { from { transform: translateX(0); } to { transform: translateX(50px); } }</style>
</head>
<body>
<main><h1>Rörelse</h1><p class="glid">Glider fram och tillbaka.</p></main>
</body>
</html>
