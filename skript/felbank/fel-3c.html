<!doctype html>
<!-- Felbanken, kontroll 3c: roten klipper med overflow-x: hidden, och en text går utanför fönstret i 320 px. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 3c</title>
<style>html, body { overflow-x: hidden; }</style>
</head>
<body>
<main><h1>Bred sida</h1><p style="width:480px">Den här texten har en fast bredd som är bredare än fönstret och klipps bort.</p></main>
</body>
</html>
