<!doctype html>
<!-- Felbanken, kontroll 8g: en ruta med fast höjd och overflow: hidden som klipper texten när textavståndet ökas enligt WCAG 1.4.12. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 8g</title>
</head>
<body>
<main><h1>Textavstånd</h1><div style="height:1.3em;width:190px;overflow:hidden"><p style="margin:0;line-height:1.2">Kort text som ryms här.</p></div></main>
</body>
</html>
