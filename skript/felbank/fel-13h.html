<!doctype html>
<!-- Felbanken, kontroll 13h: rubrikens ord glider in ett i taget efter en fördröjning. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsida 13h</title>
<style>.ord { display: inline-block; animation: upp 0.6s 1.5s both; } .ord + .ord { animation-delay: 1.7s; } @keyframes upp { from { opacity: 0; transform: translateY(0.5em); } }</style>
</head>
<body>
<main><h1><span class="ord">Rörmokare</span> <span class="ord">i Ort</span></h1><p>Rubriken animeras in ord för ord.</p></main>
</body>
</html>
